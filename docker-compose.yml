services:
    unblockneteasemusic:
        build: .
        image: unblockneteasemusic:local
        restart: unless-stopped
        env_file: .env
        environment:
            NODE_ENV: production
            SIGN_CERT: /app/certs/server.crt
            SIGN_KEY: /app/certs/server.key
        command: ["-p", "8080:8081", "-e", "${PUBLIC_ENDPOINT:-http://127.0.0.1:8080}"]
        volumes:
            - ./certs:/app/certs:ro
        ports:
            - "${HTTP_PROXY_PORT:-8080}:8080"
            - "${HTTPS_PROXY_PORT:-8081}:8081"
